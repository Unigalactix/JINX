  <text x="800" y="2100" fill="#ede9df" text-anchor="middle" font-family="Georgia, serif" font-size="42">The world remains. The sky remembers.</text>
  <text x="800" y="2220" fill="#d9c4a0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" letter-spacing="8">CHAPTER 1 / CHAPTER 2</text>
