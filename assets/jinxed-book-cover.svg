  <circle cx="800" cy="1370" r="410" fill="url(#ocean)" stroke="#b0d8d2" stroke-width="3"/>
  <g clip-path="url(#sphere)" fill="#698e64">
    <path d="m460 1070 160-90 130 30 80 100-80 60-70 100-90-40-60 50-30-100-90-30z"/>
    <path d="m700 1300 130 70 65 100-40 130-70 100-55-140-50-110z"/>
