<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2400" viewBox="0 0 1600 2400" role="img" aria-labelledby="title desc">
  <title id="title">JINXED - The ring remains</title>
  <desc id="desc">An Earth-like blue planet with green continents and a golden debris ring. Chapters 1 and 2.</desc>
  <defs>
    <radialGradient id="ocean" cx=".3" cy=".2"><stop stop-color="#72bbd3"/><stop offset=".5" stop-color="#1f6086"/><stop offset="1" stop-color="#091520"/></radialGradient>
    <radialGradient id="shade" cx=".25" cy=".2" r=".85"><stop offset=".35" stop-color="#06101a" stop-opacity="0"/><stop offset="1" stop-color="#02060c" stop-opacity=".95"/></radialGradient>
    <clipPath id="sphere"><circle cx="800" cy="1370" r="410"/></clipPath>
  </defs>
  <path fill="#101315" d="M0 0h1600v2400H0z"/>
  <path d="M90 90h1420v2220H90z" fill="none" stroke="#394341" stroke-width="2"/>
