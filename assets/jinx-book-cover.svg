<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2400" viewBox="0 0 1600 2400" role="img" aria-labelledby="cover-title cover-description">
  <title id="cover-title">JINX - A Rajesh Kodaganti's Migration</title>
  <desc id="cover-description">A dark science-fiction book cover adapted from the JINX website hero. Oversized ivory lettering sits above a fractured, copper-lit moon, a fine orbital ellipse, sparse stars, and the curved horizon of a dying world. The subtitle reads A Rajesh Kodaganti's Migration.</desc>
  <defs>
    <radialGradient id="space" cx="73%" cy="49%" r="65%">
      <stop stop-color="#1b2523"/>
      <stop offset=".56" stop-color="#101719"/>
      <stop offset="1" stop-color="#101315"/>
    </radialGradient>
    <radialGradient id="moon-light" cx="32%" cy="26%" r="76%">
      <stop stop-color="#a99d85"/>
      <stop offset=".2" stop-color="#726c5d"/>
      <stop offset=".49" stop-color="#444940"/>
      <stop offset=".77" stop-color="#202a28"/>
      <stop offset="1" stop-color="#101817"/>
    </radialGradient>
    <linearGradient id="moon-shadow" x1="0" y1=".25" x2="1" y2=".6" gradientUnits="objectBoundingBox">
      <stop offset=".08" stop-color="#101315" stop-opacity="0"/>
      <stop offset=".3" stop-color="#101315" stop-opacity=".12"/>
      <stop offset=".76" stop-color="#101315" stop-opacity=".78"/>
      <stop offset="1" stop-color="#101315" stop-opacity=".94"/>
    </linearGradient>
    <radialGradient id="moon-rim" cx="25%" cy="20%" r="85%">
      <stop stop-color="#dcd8bc" stop-opacity=".65"/>
      <stop offset=".6" stop-color="#b8c9b6" stop-opacity=".12"/>
      <stop offset="1" stop-color="#101315" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horizon-light" cx="52%" cy="0" r="75%">
      <stop stop-color="#614335"/>
      <stop offset=".14" stop-color="#292a29"/>
      <stop offset=".52" stop-color="#151a1c"/>
      <stop offset="1" stop-color="#101315"/>
    </radialGradient>
    <linearGradient id="lower-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#101315" stop-opacity="0"/>
      <stop offset=".72" stop-color="#101315" stop-opacity=".88"/>
      <stop offset="1" stop-color="#101315"/>
    </linearGradient>
    <filter id="halo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <filter id="crack-glow" x="-50%" y="-20%" width="200%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soften">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="moon-disc">
      <circle cx="970" cy="1190" r="482"/>
    </clipPath>
    <path id="fracture" d="M854 696 889 863 850 982 928 1116 875 1183 945 1362 887 1511 927 1690 907 1690 867 1511 919 1362 849 1183 901 1116 824 982 863 863 828 696Z"/>
    <path id="world-edge" d="M-220 2140C230 1760 1020 1565 1820 1570L1820 2620H-220Z"/>
  </defs>

  <path fill="url(#space)" d="M0 0h1600v2400H0z"/>
  <g fill="#ede9df">
    <circle cx="1400" cy="300" r="2" opacity=".45"/>
    <circle cx="1290" cy="654" r="2.3" opacity=".7"/>
    <circle cx="266" cy="809" r="1.5" opacity=".6"/>
    <circle cx="506" cy="700" r="1.4" opacity=".45"/>
    <circle cx="1470" cy="907" r="1.5" opacity=".5"/>
    <circle cx="185" cy="1271" r="2" opacity=".55"/>
    <circle cx="371" cy="1460" r="1.7" opacity=".5"/>
    <circle cx="1380" cy="1490" r="1.6" opacity=".65"/>
    <circle cx="197" cy="1657" r="1.3" opacity=".4"/>
