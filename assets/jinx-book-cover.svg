    <circle cx="970" cy="1190" r="482" fill="url(#moon-light)"/>
    <g clip-path="url(#moon-disc)">
      <g fill="none" stroke="#0b1212" opacity=".17" filter="url(#soften)">
        <ellipse cx="777" cy="940" rx="39" ry="35" stroke-width="7"/>
        <ellipse cx="777" cy="940" rx="88" ry="80" stroke-width="9"/>
        <ellipse cx="777" cy="940" rx="142" ry="129" stroke-width="10"/>
        <ellipse cx="777" cy="940" rx="198" ry="180" stroke-width="12"/>
        <ellipse cx="777" cy="940" rx="253" ry="232" stroke-width="11"/>
        <ellipse cx="777" cy="940" rx="310" ry="286" stroke-width="13"/>
        <ellipse cx="777" cy="940" rx="372" ry="345" stroke-width="12"/>
        <ellipse cx="777" cy="940" rx="433" ry="401" stroke-width="14"/>
        <ellipse cx="777" cy="940" rx="492" ry="455" stroke-width="13"/>
        <ellipse cx="777" cy="940" rx="552" ry="510" stroke-width="15"/>
        <ellipse cx="777" cy="940" rx="614" ry="566" stroke-width="13"/>
        <ellipse cx="777" cy="940" rx="675" ry="622" stroke-width="15"/>
      </g>
      <g fill="#0e1618" filter="url(#soften)">
        <ellipse cx="1163" cy="942" rx="85" ry="79" opacity=".26"/>
        <ellipse cx="892" cy="1335" rx="100" ry="108" opacity=".38"/>
        <ellipse cx="672" cy="1094" rx="34" ry="43" opacity=".13"/>
      </g>
      <use href="#fracture" fill="#d65939" opacity=".8" filter="url(#crack-glow)"/>
      <use href="#fracture" fill="#e47c57" opacity=".82"/>
      <circle cx="970" cy="1190" r="484" fill="url(#moon-shadow)"/>
    </g>
    <circle cx="970" cy="1190" r="480" fill="none" stroke="url(#moon-rim)" stroke-width="3"/>
  </g>

  <ellipse cx="933" cy="1370" rx="866" ry="290" transform="rotate(-29 933 1370)" fill="none" stroke="#778074" stroke-opacity=".23" stroke-width="1.5"/>
  <use href="#world-edge" fill="none" stroke="#b76032" stroke-width="34" opacity=".18" filter="url(#halo)"/>
  <use href="#world-edge" fill="url(#horizon-light)" stroke="#a9795b" stroke-opacity=".48" stroke-width="1.5"/>
  <path fill="url(#lower-shade)" d="M0 1810h1600v590H0z"/>

  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="18" letter-spacing="3" fill="#a4aaa6">
    <circle cx="128" cy="142" r="4" fill="#b8c9b6"/>
    <text x="151" y="148">A SURVIVAL ARCHIVE</text>
    <text x="1472" y="148" text-anchor="end">2165 / 2180</text>
  </g>
  <path d="M124 190H1476" stroke="#343c3b" stroke-width="1"/>
  <text x="106" y="603" fill="#ede9df" font-family="'Segoe UI', Arial, sans-serif" font-size="460" font-weight="850" letter-spacing="-35" textLength="1220" lengthAdjust="spacingAndGlyphs">JINX</text>
  <circle cx="1426" cy="575" r="40" fill="#df6954"/>

  <g font-family="Georgia, 'Times New Roman', serif" fill="#ede9df">
    <text x="128" y="1910" font-size="57">A Rajesh Kodaganti's</text>
    <text x="120" y="2058" font-size="140" letter-spacing="-4">Migration</text>
  </g>
  <path d="M128 1807h76" stroke="#df6954" stroke-width="5"/>
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="18" letter-spacing="2.5" fill="#a4aaa6">
    <text x="128" y="2240">NOT A SECOND LIFE.</text>
    <text x="128" y="2274">A DIFFERENT BEGINNING.</text>
    <text x="1472" y="2274" text-anchor="end">ARCHIVE JX / 001</text>
  </g>
</svg>
