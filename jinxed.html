<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101315">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="A sealed Earth archive.">
  <title>Sealed archive</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/site.css">
  <link rel="stylesheet" href="./assets/book-fonts.css">
  <link rel="stylesheet" href="./assets/book.css">
  <link rel="stylesheet" href="./assets/jinxed.css">
  <link rel="stylesheet" href="./assets/jinxed-videos.css">
  <script type="module" src="./assets/jinxed.js"></script>
</head>
<body class="jinxed-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="wordmark" href="#main" id="archive-wordmark">Archive<span class="brand-dot"></span></a>
    <nav class="primary-nav" aria-label="Archive navigation" id="jinxed-nav" hidden>
      <a href="#chapters">Read</a>
      <a href="#moments">Key moments</a>
      <a href="#references">References</a>
    </nav>
    <button class="text-link" id="lock-archive" type="button" hidden>Lock &amp; leave</button>
  </header>
  <main id="main">
    <section class="section-shell section-space" id="sealed-archive">
      <p class="eyebrow">Restricted reading</p>
      <h1>Sealed archive.</h1>
      <p>Enter the special code to reveal this archive.</p>
      <button class="button button-primary" id="unlock-archive" type="button">Enter code</button>
      <a class="text-link" href="./index.html">Leave archive</a>
      <noscript><p>JavaScript is required to unlock and read this archive.</p></noscript>
    </section>
    <p class="section-shell site-notice" id="archive-status" role="status" hidden></p>
    <button class="button button-secondary" id="retry-archive" type="button" hidden>Retry loading archive</button>
    <div id="jinxed-content" hidden></div>
  </main>
</body>
</html>
